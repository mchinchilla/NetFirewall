name: Release bundle

# Builds the release bundle (deploy/build-bundle.sh): every binary published
# self-contained for linux-x64 + migrations + units + setup.sh, in one tar.gz,
# and publishes it as a GitHub Release.
#
#   push to master  -> next version from the latest vX.Y.Z tag, tagged and released:
#                        patch by default · "[minor]" / "[major]" in the commit
#                        message bumps that part · "[skip release]" only uploads
#                        the bundle as a 14-day artifact
#   tag v* (manual) -> released with exactly that version
#   manual dispatch -> artifact only, version from git describe
#
# The checkout carries the full history and tags: the next version and
# `git describe` both read them. Tags created here use GITHUB_TOKEN, which does
# not trigger another run, so a master push releases exactly once.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create tags and Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-published release

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  KNOWN_FAILING: FullyQualifiedName!~Generate_InvertedRule_OnDisabledSchedule_IsEmitted

jobs:
  bundle:
    name: Build release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # history + tags

      # Before anything builds: the Web build regenerates the tracked
      # wwwroot/css/site.css, and describing the tree after that would stamp
      # every CI bundle "-dirty".
      - name: Resolve version
        id: version
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          release=false; create_tag=false; tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"; release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/master ]] \
               && ! grep -qiF '[skip release]' <<< "${HEAD_MESSAGE:-}"; then
            release=true
            # Re-run of a commit that already got its tag: release that one again.
            tag=$(git tag --points-at HEAD | grep -E "$semver" | sort -V | tail -1 || true)
            if [[ -z "$tag" ]]; then
              last=$(git tag --list | grep -E "$semver" | sort -V | tail -1 || true)
              IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
              major=${major#v}
              if grep -qiF '[major]' <<< "${HEAD_MESSAGE:-}"; then
                major=$((major + 1)); minor=0; patch=0
              elif grep -qiF '[minor]' <<< "${HEAD_MESSAGE:-}"; then
                minor=$((minor + 1)); patch=0
              else
                patch=$((patch + 1))
              fi
              tag="v$major.$minor.$patch"; create_tag=true
              echo "Bump: ${last:-none} -> $tag"
            fi
          fi
          if [[ -n "$tag" ]]; then
            version="${tag#v}"
          else
            version=$(git describe --tags --always --dirty); version="${version#v}"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $version  release=$release  new tag=$create_tag"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install standalone tailwindcss
        run: |
          curl -fsSL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.0/tailwindcss-linux-x64
          chmod 0755 /usr/local/bin/tailwindcss

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test -c Release --filter "$KNOWN_FAILING"

      - name: Build bundle
        run: |
          deploy/build-bundle.sh --version '${{ steps.version.outputs.version }}' --output dist
          ls -lh dist/

      # The tarball must install from scratch: setup.sh, every binary the units
      # run, the migrations, and tokenized (secret-free) env templates.
      - name: Verify bundle
        run: |
          set -eu
          v='${{ steps.version.outputs.version }}'
          tmp=$(mktemp -d)
          tar xzf "dist/netfirewall-$v.tar.gz" -C "$tmp"
          root="$tmp/netfirewall-$v"
          test "$(cat "$root/VERSION")" = "$v"
          bash -n "$root/setup.sh"
          for bin in daemon/netfirewall-daemon web/NetFirewall.Web dhcp-server/NetFirewall.DhcpServer \
                     migrations/netfirewall-migrate tui/netfirewall-tui doctor/netfirewall-doctor; do
            test -x "$root/app/$bin" || { echo "missing app/$bin"; exit 1; }
          done
          ls "$root"/app/migrations/sql/migrations/*.sql >/dev/null
          for t in daemon web dhcp; do grep -q '__REPLACE__' "$root/deploy/env/$t.env.template"; done
          # The self-contained binaries run on a bare runner (no dotnet on PATH needed).
          "$root/app/doctor/netfirewall-doctor" --help >/dev/null
          (cd dist && sha256sum -c "netfirewall-$v.tar.gz.sha256")

      - name: Upload artifact
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: netfirewall-${{ steps.version.outputs.version }}
          path: dist/netfirewall-*
          retention-days: 14
          compression-level: 0   # already gzipped

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CREATE_TAG: ${{ steps.version.outputs.create_tag }}
        run: |
          set -eu
          notes=$(cat <<NOTES
          NetFirewall $VERSION — commit ${GITHUB_SHA:0:12}

          Install or upgrade on the firewall (as root):

              tar xzf netfirewall-$VERSION.tar.gz && cd netfirewall-$VERSION
              ./setup.sh --preflight
              ./setup.sh

          Rollback: ./setup.sh --rollback · Full reference: docs/setup.md
          NOTES
          )
          if [[ "$CREATE_TAG" == true ]]; then
            # Creates the tag on this exact commit along with the Release.
            gh release create "$TAG" dist/netfirewall-* --target "$GITHUB_SHA" \
              --title "NetFirewall $VERSION" --notes "$notes" --generate-notes
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/netfirewall-* --clobber
          else
            gh release create "$TAG" dist/netfirewall-* --verify-tag \
              --title "NetFirewall $VERSION" --notes "$notes" --generate-notes
          fi
